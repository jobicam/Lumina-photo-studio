name: Release Lumina Photo APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.5.0)'
        required: true
        default: 'v2.5.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36.1
            build-tools;36.0.0

      - name: Decode signing keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            test -s debug.keystore
          else
            echo "Error: debug.keystore.base64 not found in repository root." >&2
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests & build APK
        run: |
          gradle :app:testDebugUnitTest :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx2560m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=2

      - name: Stage release artifacts
        run: |
          RAW_TAG="${{ github.event.inputs.tag }}"
          if [ -z "$RAW_TAG" ]; then
            RAW_TAG="${GITHUB_REF_NAME}"
          fi
          TAG_NAME=$(echo "$RAW_TAG" | tr -d '[:space:]')
          if [ -z "$TAG_NAME" ]; then
            echo "Error: Could not resolve release tag name." >&2
            exit 1
          fi
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

          test -s app/build/outputs/apk/debug/app-debug.apk
          cp -f app/build/outputs/apk/debug/app-debug.apk LuminaPhoto.apk
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/LuminaPhoto.apk"
          jq --arg url "$APK_URL" '.downloadUrl = $url' version.json > version.release.json
          mv -f version.release.json version.json

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuminaPhoto-${{ env.TAG_NAME }}
          path: |
            LuminaPhoto.apk
            version.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$(jq -r '.releaseNotes // "Lumina Photo release"' version.json)
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" LuminaPhoto.apk version.json --clobber
            gh release edit "$TAG_NAME" --title "Lumina Photo $TAG_NAME" --notes "$NOTES"
          else
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              gh release create "$TAG_NAME" LuminaPhoto.apk version.json \
                --target "${{ github.sha }}" \
                --title "Lumina Photo $TAG_NAME" \
                --notes "$NOTES"
            else
              gh release create "$TAG_NAME" LuminaPhoto.apk version.json \
                --title "Lumina Photo $TAG_NAME" \
                --notes "$NOTES"
            fi
          fi || {
            echo "Failed to publish GitHub Release. Ensure Settings -> Actions -> General -> Workflow permissions is set to 'Read and write permissions'." >&2
            exit 1
          }
