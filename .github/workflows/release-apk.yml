name: Release Lumina Photo APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.8.0)'
        required: true
        default: 'v2.8.0'
      apk_name:
        description: 'APK file name (e.g. LuminaPhoto.apk)'
        required: false
        default: 'LuminaPhoto.apk'
      release_title:
        description: 'Release title (leave blank for Lumina Photo <tag>)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT"
          fi

          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/"*"/bin/sdkmanager" \
            "$(command -v sdkmanager 2>/dev/null || true)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found; downloading Android command-line tools..."
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-unpack
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv /tmp/cmdline-tools-unpack/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-tools-unpack
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ ! -w "$SDK_ROOT" ] || { [ -d "$SDK_ROOT/licenses" ] && [ ! -w "$SDK_ROOT/licenses" ]; } || { [ -d "$SDK_ROOT/platforms" ] && [ ! -w "$SDK_ROOT/platforms" ]; }; then
            sudo chown -R "$(id -un):$(id -gn)" "$SDK_ROOT"
          fi
          mkdir -p "$SDK_ROOT/licenses"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version || true

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"
          set -o pipefail

          ls -la "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools"

      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Decoding DEBUG_KEYSTORE_BASE64 secret..."
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore.base64..."
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ -f debug.keystore ]; then
            echo "Using existing debug.keystore."
          else
            echo "::warning::Neither DEBUG_KEYSTORE_BASE64 secret nor debug.keystore.base64 was found. Generating an ephemeral CI keystore; Android will reject in-place APK updates over builds signed with a different key."
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -storetype PKCS12 \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1|SHA256" || keytool -list -keystore debug.keystore -storepass android >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests & build APK
        run: |
          gradle :app:testDebugUnitTest :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx2560m -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=2

      - name: Stage release artifacts
        run: |
          RAW_TAG="${{ github.event.inputs.tag }}"
          if [ -z "$RAW_TAG" ]; then
            RAW_TAG="${GITHUB_REF_NAME}"
          fi
          TAG_NAME=$(echo "$RAW_TAG" | tr -d '[:space:]')
          if [ -z "$TAG_NAME" ]; then
            echo "Error: Could not resolve release tag name." >&2
            exit 1
          fi

          RAW_APK_NAME="${{ github.event.inputs.apk_name }}"
          APK_NAME=$(basename "$(echo "$RAW_APK_NAME" | tr -d '\r\n' | xargs | tr ' ' '-')")
          if [ -z "$APK_NAME" ] || [ "$APK_NAME" = "." ] || [ "$APK_NAME" = ".." ]; then
            APK_NAME="LuminaPhoto.apk"
          fi
          case "$APK_NAME" in
            *.apk|*.APK) ;;
            *) APK_NAME="${APK_NAME}.apk" ;;
          esac

          RAW_TITLE="${{ github.event.inputs.release_title }}"
          RELEASE_TITLE=$(echo "$RAW_TITLE" | tr -d '\r\n' | xargs)
          if [ -z "$RELEASE_TITLE" ]; then
            RELEASE_TITLE="Lumina Photo $TAG_NAME"
          fi

          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> "$GITHUB_ENV"

          test -s app/build/outputs/apk/debug/app-debug.apk
          cp -f app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/${APK_NAME}"
          jq --arg url "$APK_URL" '.downloadUrl = $url' version.json > version.release.json
          mv -f version.release.json version.json

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v6
        with:
          name: LuminaPhoto-${{ env.TAG_NAME }}
          path: |
            ${{ env.APK_NAME }}
            version.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$(jq -r '.releaseNotes // "Lumina Photo release"' version.json)
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$APK_NAME" version.json --clobber
            gh release edit "$TAG_NAME" --title "$RELEASE_TITLE" --notes "$NOTES"
          else
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              gh release create "$TAG_NAME" "$APK_NAME" version.json \
                --target "${{ github.sha }}" \
                --title "$RELEASE_TITLE" \
                --notes "$NOTES"
            else
              gh release create "$TAG_NAME" "$APK_NAME" version.json \
                --title "$RELEASE_TITLE" \
                --notes "$NOTES"
            fi
          fi || {
            echo "Failed to publish GitHub Release. Ensure Settings -> Actions -> General -> Workflow permissions is set to 'Read and write permissions'." >&2
            exit 1
          }
